<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#07090d">
  <meta name="description" content="Цифровой бизнес — сайт, продвижение и цифровой помощник для вашего бизнеса по подписке. Подключайте только нужные услуги и расширяйте возможности по мере роста.">

  <meta name="application-name" content="Цифровой бизнес">
  <meta name="apple-mobile-web-app-title" content="Цифровой бизнес">

  <title>Цифровой бизнес — ваш бизнес в интернете</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07090d;
      --bg-soft: #0b0e14;
      --surface: #10141c;
      --surface-2: #151a23;

      --text: #f4f7fb;
      --text-soft: #a9b0bd;
      --text-muted: #737c8c;

      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.15);

      --accent: #dfff00;
      --accent-text: #07090d;
      --success: #7dffb2;

      --max-width: 1240px;
      --radius: 22px;
      --transition: 220ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      margin: 0;
      min-width: 320px;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin-inline: auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-heading {
      max-width: 850px;
      margin-bottom: 45px;
    }

    .section-heading small {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin: 15px 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .section-heading p {
      max-width: 650px;
      color: var(--text-soft);
      font-size: 17px;
    }

    /* Шапка */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--line);
      background: rgba(7,9,13,.92);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 20px;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .main-nav a {
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 600;
    }

    .main-nav a:hover {
      color: var(--accent);
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 1px solid var(--line-strong);
      border-radius: 100px;
      font-size: 14px;
      font-weight: 700;
      transition: var(--transition);
    }

    .button-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .button-primary:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    .button-secondary {
      background: var(--surface);
      color: var(--text);
    }

    /* Первый экран */

    .hero {
      padding: 110px 0 90px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 100px;
      color: var(--text-soft);
      font-size: 12px;
    }

    .hero h1 {
      margin: 0 0 25px;
      font-size: clamp(42px, 6.5vw, 82px);
      line-height: .98;
      letter-spacing: -.06em;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero-description {
      max-width: 600px;
      margin-bottom: 30px;
      color: var(--text-soft);
      font-size: 18px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-note {
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .hero-card {
      padding: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 30px;
      background: linear-gradient(145deg, #151a23, #0b0e14);
      box-shadow: 0 30px 90px rgba(0,0,0,.25);
    }

    .hero-card-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .hero-card h3 {
      margin: 15px 0;
      font-size: 32px;
      line-height: 1.1;
    }

    .hero-card p {
      color: var(--text-soft);
    }

    .feature-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .feature-check {
      color: var(--accent);
      font-weight: 800;
    }
  </style>
</head>
