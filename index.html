<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Цифровой помощник</title>
    <meta name="theme-color" content="#f5f5f7">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <style>
        @import url('https://googleapis.com');

        :root {
            /* Светлая тема Apple */
            --bg-main: #f5f5f7;
            --bg-card: #ffffff;
            --ink: #1d1d1f;
            --muted: #86868b;
            --blue: #0071e3;
            --green: #34a853;
            --purple: #6e56cf;
            --line: rgba(29, 29, 31, 0.08);
            --blur-bg: rgba(255, 255, 255, 0.8);
            --chat-user-bg: #0071e3;
            --chat-user-text: #ffffff;
            --chat-ai-bg: #e5e5ea;
        }

        [data-theme="dark"] {
            /* Премиальная OLED темная тема */
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --ink: #f5f5f7;
            --muted: #86868b;
            --blue: #2997ff;
            --green: #30d158;
            --purple: #7d7aff;
            --line: rgba(255, 255, 255, 0.12);
            --blur-bg: rgba(28, 28, 30, 0.8);
            --chat-user-bg: #2997ff;
            --chat-user-text: #ffffff;
            --chat-ai-bg: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--ink);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Оболочка для экранов */
        .app-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px; /* Отступ под нижнее меню */
            position: relative;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Премиальные карточки Apple-Style */
        .premium-card {
            background-color: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Ниже идут стили для конкретных экранов */
        
        /* ЭКРАН 1: ПРИВЕТСТВИЕ */
        #screen-welcome {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 50% 30%, var(--purple) 0%, transparent 70%), var(--bg-main);
            padding: 40px 24px;
        }
        #screen-welcome.active { display: flex; }
        .welcome-logo { width: 80px; height: 80px; background: #fff; border-radius: 22px; display: grid; place-items: center; font-size: 40px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .welcome-title { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; line-height: 1.1; }
        .welcome-desc { color: var(--muted); font-size: 16px; margin-bottom: 40px; max-width: 300px; line-height: 1.4; }

        .btn-apple { background: var(--blue); color: #fff; width: 100%; max-width: 320px; padding: 16px; border-radius: 999px; font-size: 16px; font-weight: 600; text-align: center; border: none; cursor: pointer; margin-bottom: 12px; }
        .btn-apple-sec { background: transparent; border: 1px solid var(--line); color: var(--ink); width: 100%; max-width: 320px; padding: 16px; border-radius: 999px; font-size: 16px; font-weight: 600; text-align: center; }

        /* ЭКРАН 2: ГЛАВНАЯ */
        .biz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; margin-top: 10px; }
        .biz-avatar { width: 44px; height: 44px; background: var(--purple); color: white; border-radius: 12px; display: grid; place-items: center; font-size: 20px; font-weight: bold; }
        .biz-title h3 { font-size: 18px; font-weight: 700; }
        .biz-title p { font-size: 12px; color: var(--green); font-weight: 500; }

        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .mini-metric { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
        .mini-metric span { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
        .mini-metric strong { font-size: 18px; font-weight: 700; }

        /* ЭКРАН 3: РЕСУРСЫ */
        .resource-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
        .resource-item:last-child { border-bottom: none; }
        .resource-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--bg-main); }
        .resource-info { flex: 1; }
        .resource-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .resource-info p { font-size: 11px; color: var(--muted); }
        .arrow-r { color: var(--muted); font-size: 14px; }

        /* ЭКРАН 4: ЧАТ С ИИ */
        .chat-box { display: flex; flex-direction: column; height: calc(100vh - 160px); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .msg.user { background: var(--chat-user-bg); color: var(--chat-user-text); align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.ai { background: var(--chat-ai-bg); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .chat-suggestions { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .chat-suggestions::-webkit-scrollbar { display: none; }
        .suggest-btn { background: var(--bg-card); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--ink); }

        .chat-input-area { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
        .chat-input { flex: 1; background: var(--bg-card); border: 1px solid var(--line); padding: 12px 16px; border-radius: 999px; color: var(--ink); font-size: 14px; }
        .chat-send-btn { width: 42px; height: 42px; background: var(--blue); color: white; border-radius: 50%; display: grid; place-items: center; font-size: 16px; }

        /* ЭКРАН 5: ПРОФИЛЬ */
        .profile-user { text-align: center; padding: 20px 0; }
        .profile-avatar { width: 70px; height: 70px; background: var(--purple); color: white; border-radius: 50%; display: grid; place-items: center; font-size: 28px; margin: 0 auto 12px; }
        
        /* ПРЕМИУМ iOS TAB BAR (НИЖНЕЕ МЕНЮ) */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 74px;
            background: var(--blur-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--line);
            display: none; /* Скрыт на экране приветствия */
            justify-content: space-around;
            align-items: center;
            padding-bottom: 12px;
            z-index: 100;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--muted);
            font-size: 10px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            gap: 4px;
        }
        
        .tab-item.active {
            color: var(--blue);
        }
        
        .tab-icon {
            font-size: 20px;
        }

        /* Индикатор загрузки ИИ */
        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
        <div id="screen-welcome" class="screen active">
            <div class="welcome-logo">🤖</div>
            <h1 class="welcome-title">Цифровой<br>бизнес</h1>
            <p class="welcome-desc">Ваш бизнес под контролем. Всё в одном приложении.</p>
            <button class="btn-apple" onclick="navigateTo('screen-main')">Начать</button>
            <button class="btn-apple-sec" onclick="navigateTo('screen-main')">Войти</button>
        </div>

        <!-- ЭКРАН 2: ГЛАВНАЯ -->
        <div id="screen-main" class="screen">
