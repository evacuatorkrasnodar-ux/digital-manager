<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Цифровой бизнес — Ваш бизнес. На новом уровне.</title>
<meta name="description" content="Цифровая платформа для развития бизнеса: сайт, клиенты, продвижение и умный помощник в одном месте.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    /* Светлая тема Apple */
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --blue: #0071e3;
    --line: rgba(29,29,31,.08);
    --white: #fff;
    --dash-side-bg: #f7f7f9;
    --assistant-bg: #f5f9ff;
    --assistant-border: #e0edff;
    --transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

[data-theme="dark"] {
    /* Премиальная OLED темная тема */
    --bg: #000000;
    --ink: #f5f5f7;
    --muted: #86868b;
    --blue: #2997ff;
    --line: rgba(255,255,255,.15);
    --white: #1c1c1e;
    --dash-side-bg: #121214;
    --assistant-bg: #131722;
    --assistant-border: #242f48;
}

* { box-sizing: border-box; transition: var(--transition); }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }
.container { width: min(1160px, calc(100% - 48px)); margin: auto; }

/* Шапка с эффектом размытия стекла */
header { position: sticky; top: 0; z-index: 20; background: rgba(250,250,252,.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
[data-theme="dark"] header { background: rgba(0,0,0,.75); }

.nav { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: -.4px; }
.brand-icon { width: 30px; height: 30px; background: var(--ink); color: var(--bg); border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.links { display: flex; gap: 28px; color: var(--muted); font-size: 12px; }
.links a:hover { color: var(--blue); }
.nav-actions { display: flex; gap: 12px; align-items: center; font-size: 12px; }

/* Переключатель тем */
.theme-toggle { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink); font-size: 16px; cursor: pointer; }
.theme-toggle:hover { transform: scale(1.05); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: #0077ed; transform: translateY(-1px); }
.btn-outline { border: 1px solid var(--line); background: rgba(255,255,255,.4); color: var(--ink); }
[data-theme="dark"] .btn-outline { background: rgba(28,28,30,.5); }
.btn-outline:hover { background: var(--white); }

/* Главный блок */
.hero { text-align: center; padding: 105px 0 70px; background: radial-gradient(ellipse at 50% 0%, var(--white) 0%, var(--bg) 68%); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--assistant-bg); color: var(--blue); border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 600; margin-bottom: 26px; }
.dot { width: 7px; height: 7px; background: #34a853; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

.hero h1 { font-size: clamp(46px, 7.2vw, 88px); line-height: .99; letter-spacing: -.075em; margin: 0 auto 24px; max-width: 950px; font-weight: 700; }
.gradient { background: linear-gradient(100deg, #0071e3 10%, #6e56cf 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { font-size: clamp(17px, 2vw, 21px); line-height: 1.5; color: var(--muted); max-width: 650px; margin: 0 auto 30px; }
.hero-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

/* Визуализация Дашборда */
.hero-visual { margin: 66px auto 0; max-width: 1000px; background: var(--white); border: 1px solid var(--line); border-radius: 30px; padding: 18px; box-shadow: 0 35px 90px rgba(0,0,0,.08); text-align: left; }
.windowbar { display: flex; gap: 6px; padding: 4px 4px 16px; }
.windowbar i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); opacity: 0.5; }

.dashboard { display: grid; grid-template-columns: 210px 1fr; gap: 16px; min-height: 380px; }
@media(max-width:768px){ .dashboard { grid-template-columns: 1fr; } }
.dash-side { background: var(--dash-side-bg); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.dash-logo { font-size: 11px; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }
.dash-item { padding: 11px 12px; border-radius: 10px; font-size: 12px; color: var(--muted); margin: 4px 0; cursor: pointer; }
.dash-item.active { background: var(--assistant-bg); color: var(--blue); font-weight: 600; border: 1px solid var(--assistant-border); }

.dash-main { background: var(--white); border: 1px solid var(--line); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; }
.dash-top { display: flex; justify-content: space-between; gap: 15px; align-items: start; }
.dash-top h3 { font-size: 23px; letter-spacing: -1px; margin: 0 0 7px; font-weight: 700; }
.dash-top p { font-size: 12px; color: var(--muted); margin: 0; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--assistant-bg); color: var(--blue); display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 1px solid var(--assistant-border); }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 24px 0; }
.metric { border: 1px solid var(--line); border-radius: 14px; padding: 17px; background: rgba(255,255,255,0.02); }
.metric small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 10px; font-weight: 500; }
.metric strong { font-size: 25px; letter-spacing: -1px; font-weight: 700; }
.up { font-size: 11px; color: #24845d; margin-top: 7px; display: flex; align-items: center; gap: 4px; font-weight: 600; }

/* Секция ИИ-помощника */
.assistant-card { display: flex; gap: 15px; background: var(--assistant-bg); border: 1px solid var(--assistant-border); border-radius: 16px; padding: 18px; align-items: flex-start; position: relative; overflow: hidden; }
.assistant-icon { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px; background: var(--blue); color: white; display: grid; place-items: center; font-weight: 700; font-size: 16px; box-shadow: 0 4px 12px rgba(0,113,227,0.2); }
.assistant-content { flex: 1; }
.assistant-card b { font-size: 13px; display: block; margin-bottom: 2px; }
.assistant-card p { font-size: 12px; line-height: 1.5; color: var(--ink); opacity: 0.9; margin: 7px 0 12px; min-height: 36px; }
.chat-actions { display: flex; gap: 8px; }
.btn-chat { background: var(--blue); color: white; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.btn-chat-sec { background: var(--line); color: var(--ink); padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 600; }

/* Стилизация остальных блоков */
.section { padding: 95px 0; border-top: 1px solid var(--line); }
.section-head { text-align: center; max-width: 730px; margin: 0 auto 48px; }
.kicker { text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 15px; }
.section h2 { font-size: clamp(34px, 5vw, 56px); line-height: 1.05; letter-spacing: -.06em; margin: 0 0 18px; font-weight: 700; }
.section-head p { font-size: 18px; line-height: 1.55; color: var(--muted); margin: 0; }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media(max-width:768px){ .feature-grid { grid-template-columns: 1fr; } }
.feature { background: var(--white); border: 1px solid var(--line); border-radius: 25px; padding: 30px; min-height: 260px; }
.feature-icon { width: 48px; height: 48px; border-radius: 15px; background: var(--assistant-bg); color: var(--blue); display: grid; place-items: center; font-size: 22px; margin-bottom: 28px; border: 1px solid var(--assistant-border); }
.feature h3 { font-size: 21px; letter-spacing: -.7px; margin: 0 0 12px; font-weight: 600; }
.feature p { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0; }

.cta { background: #1d1d1f; color: white; border-radius: 30px; padding: 70px 30px; text-align: center; }
[data-theme="dark"] .cta { background: #1c1c1e; border: 1px solid var(--line); }
.cta h2 { font-size: clamp(36px, 5vw, 60px); letter-spacing: -.065em; line-height: 1.04; margin: 0 auto 20px; max-width: 750px; font-weight: 700; }
.cta p { color: #b7b7bd; font-size: 17px; line-height: 1.55; max-width: 570px; margin: 0 auto 28px; }
.cta .btn-blue { background: white; color: #1d1d1f; }
.cta .btn-blue:hover { background: #e8e8ed; }
footer { padding: 35px 0; text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
    <div class="container nav">
        <div class="brand">
            <div class="brand-icon">🤖</div>
            <span>Цифровой бизнес</span>
        </div>
        <div class="links">
            <a href="#features">Возможности</a>
            <a href="#demo">Интерфейс</a>
            <a href="app.html">Открыть приложение</a>
        </div>
