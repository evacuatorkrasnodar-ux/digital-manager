name: PWA code safety
on:
  push:
    branches:
      - refactor/unify-app-20261014
      - refactor/clean-legacy-styles-20261014
      - refactor/css-rule-dedup-20261014
      - refactor/black-velvet-unity-20261014
      - refactor/shared-controls-20261014
      - refactor/card-surface-cleanup-20261014
      - refactor/visual-unity-components-20261014
      - refactor/shared-card-rhythm-20261014
      - refactor/navigation-unity-20261014
      - refactor/unified-card-arrows-20261014
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/pwa-code-safety.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared imports
        run: node scripts/check-app-assets.mjs
      - name: Check cross-page visual foundations
        run: node scripts/check-style-unity.mjs
      - name: Audit unreferenced legacy CSS
        run: node scripts/audit-css-orphans.mjs
      - name: Check PWA navigation and storage contract
        run: node scripts/check-pwa-contract.mjs
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find app -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node --check scripts/check-card-arrows.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Compare CSS visuals with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/dm-baseline" FETCH_HEAD
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pwa-head-http.log 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dm-baseline" >/tmp/pwa-base-http.log 2>&1 &
          node scripts/css-regression.mjs
      - name: Verify shared card rhythm
        run: node scripts/check-card-rhythm.mjs
      - name: Check shared card chevrons
        run: node scripts/check-card-arrows.mjs
      - name: Check shared Back navigation
        run: node scripts/check-navigation-unity.mjs
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pwa-http.log 2>&1 &
          node scripts/browser-smoke.mjs
